<!doctype html>
<html>
    <head>
        <title>
            Basic generative "AI"
        </title>
        <script src="script.js" defer></script>
    </head>
    <body>
        <ol>
            <li>
                Select a source text file:
                <input id="file-input" type="file">
            </li>

            <li>Input a word:
                <input id="word-input" type="text">
            </li>

            <li>How many words to follow? 
                <input id="count-input" type="number">
            </li>

            <li>Click: 
                <button>Go</button>
            </li>

            <p id="output"></p>
    </body>
</html>
